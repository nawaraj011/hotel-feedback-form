<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Developer Survey Form</title>
  </head>
  <body>
    <h1 id="title">Developer Experience Survey</h1>

    <p id="description">
      Please take a moment to tell us about your learning journey and preferences.
    </p>

    <form id="survey-form">
      <!-- Name -->
      <label id="name-label" for="name">Name</label><br />
      <input
        id="name"
        type="text"
        name="name"
        placeholder="Enter your full name"
        required
      /><br /><br />

      <!-- Email -->
      <label id="email-label" for="email">Email</label><br />
      <input
        id="email"
        type="email"
        name="email"
        placeholder="Enter your email address"
        required
      /><br /><br />

      <!-- Number -->
      <label id="number-label" for="number">Age</label><br />
      <input
        id="number"
        type="number"
        name="age"
        min="10"
        max="100"
        placeholder="Enter your age"
      /><br /><br />

      <!-- Dropdown -->
      <label for="dropdown">Current role</label><br />
      <select id="dropdown" name="role">
        <option value="">Select your role</option>
        <option value="student">Student</option>
        <option value="developer">Developer</option>
      </select><br /><br />

      <!-- Radio buttons -->
      <p>Would you recommend learning to code?</p>
      <label>
        <input
          type="radio"
          name="recommend"
          value="yes"
        />
        Yes
      </label><br />
      <label>
        <input
          type="radio"
          name="recommend"
          value="no"
        />
        No
      </label><br /><br />

      <!-- Checkboxes -->
      <p>What topics are you interested in?</p>
      <label>
        <input
          type="checkbox"
          name="topics"
          value="frontend"
        />
        Frontend
      </label><br />
      <label>
        <input
          type="checkbox"
          name="topics"
          value="backend"
        />
        Backend
      </label><br />
      <label>
        <input
          type="checkbox"
          name="topics"
          value="data-science"
        />
        Data Science
      </label><br /><br />

      <!-- Textarea -->
      <p>Additional comments</p>
      <textarea
        name="comments"
        placeholder="Enter your comments here..."
        rows="5"
        cols="30"
      ></textarea><br /><br />

      <!-- Submit -->
      <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>
